<div class="chat-container d-flex flex-column h-100">

  <!-- HEADER -->
  <div class="chat-header border-bottom p-3 bg-white">
    <h5 class="mb-0"># Channel</h5>
  </div>

  <!-- MESSAGES -->
  <div class="chat-messages flex-grow-1 p-3 overflow-auto">

    <!-- empty state -->
    <div *ngIf="messages.length === 0" class="text-center text-muted mt-5">
      No messages yet 👋
    </div>

    <!-- messages -->
    <div *ngFor="let msg of messages" class="message d-flex mb-3">

      <!-- avatar -->
       @if (msg.profilePictureUrl) {
        <img 
          [src]="msg.sender.profilePictureUrl"
          class="rounded-circle me-3"
          style="width:40px;height:40px;object-fit:cover;"
        >
       } @else {
        <div class="rounded-circle me-3 text-center" style="width:40px;height:40px;background-color:#ccc;">
          <span class="text-white" style="font-size:20px;line-height:40px;">{{ msg.sender.userName.charAt(0) || "Userche" }}</span>
        </div>
       }
      <!-- message -->
      <div>
        <div class="d-flex align-items-center">
          <strong class="me-2">{{ msg.sender.username }}</strong>
          <small class="text-muted">
            {{ msg.sentAt | date:'shortTime' }}
          </small>
        </div>

        <div class="message-content">
          {{ msg.content }}
        </div>
      </div>

    </div>

  </div>

  <!-- INPUT -->
  <div class="chat-input border-top p-3 bg-white">
    <div class="input-group">
      <input
        type="text"
        class="form-control"
        placeholder="Message..."
        [(ngModel)]="messageInput"
        (keyup.enter)="sendMessage()"
      />
      <button class="btn btn-primary" (click)="sendMessage()">
        Send
      </button>
    </div>
  </div>

</div>
