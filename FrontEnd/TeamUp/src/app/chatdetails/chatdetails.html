<div class="container-fluid" >
  <div class="d-flex" style="height: 83vh;">

    <!-- SIDEBAR -->
    <div class="bg-white text-white p-3" style="width: 260px;">
      <!-- Channels header -->
      <div class="d-flex justify-content-between align-items-center mb-2">
        <small class="text-uppercase text-muted">Channels</small>
        <button 
          class="btn btn-sm px-2 py-0"
          style="font-size: 16px; line-height: 1.3;"
          (click)="openCreateChannelModal()">
          +
        </button>
      </div>
      <hr style="color: black;">

      <!-- Channels list -->
      <ul class="nav flex-column">
        <li 
          class="nav-item"
          *ngFor="let channel of (channels$ | async)">

          <a 
            class="nav-link text-dark d-flex align-items-center"
            [routerLink]="['/workspace', workspacePublicId, 'chat', channel.publicId]"
            routerLinkActive="active-channel">

            <div class="justify-content-center align-items-center">
              <p># {{ channel.name }}</p>
              <span *ngIf="channel.isPrivate == true">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock-fill" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3"/>
                </svg>
              </span>
            </div>
          </a>
        </li>
      </ul>

    </div>

    <!-- MAIN CHAT CONTENT -->
    <div class="flex-grow-1 bg-light">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>

<!-- CREATE CHANNEL MODAL -->
<div class="modal fade" id="createChannelModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" role="document" >
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title">Create Channel</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <form>

          <!-- Name -->
          <div class="mb-3">
            <label class="form-label">Channel Name</label>
            <input 
              type="text" 
              class="form-control"
              [(ngModel)]="newChannel.name"
              name="name">
          </div>

          <!-- Description -->
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea 
              class="form-control"
              [(ngModel)]="newChannel.description"
              name="description">
            </textarea>
          </div>

          <!-- Private -->
          <div class="form-check">
            <input 
              type="checkbox" 
              class="form-check-input"
              [(ngModel)]="newChannel.isPrivate"
              name="isPrivate">
            <label class="form-check-label">Private Channel</label>
          </div>

        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button class="btn btn-primary" (click)="createChannel()">
          Create
        </button>
      </div>

    </div>
  </div>
</div>
