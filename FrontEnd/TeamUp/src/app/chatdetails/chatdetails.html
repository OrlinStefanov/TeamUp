<div class="container-fluid" [ngClass]="{'dark-mode': isDarkMode$ | async, 'light-mode': !(isDarkMode$ | async)}">
  <div class="d-flex" style="height: 83vh;">

    <!-- SIDEBAR -->
    <div class="bg-white text-white p-3 border-start border-top border-bottom" style="width: 260px;">
      <div class="input-group mb-3 border-bottom pb-2">
        <input class="form-control" type="search" placeholder="Search" aria-label="Search" id="search-input">
         <span class="input-group-text bg-white border-right" type="submit" id="search-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search text-muted" viewBox="0 0 16 16">
              <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
            </svg>
          </span>
        </div>
      <!-- Channels header -->
      <div class="d-flex justify-content-between align-items-center mb-1">
        <small class="text-uppercase" style="color: #666;">Channels</small>
        <button 
          class="btn btn-sm px-2 py-0"
          style="font-size: 16px; line-height: 1.3; color: #666;"
          (click)="openCreateChannelModal()">
          +
        </button>
      </div>

      <!-- Channels list -->
      <ul class="nav flex-column">
        <li 
          class="nav-item"
          *ngFor="let channel of (channels$ | async)">

         <a class="nav-link channel-item d-flex justify-content-between align-items-center"
          [routerLink]="['/workspace', workspacePublicId, 'chat', channel.publicId]"
          routerLinkActive="active-channel">

          <div class="d-flex align-items-center gap-2">
            <span>#</span>
            <span>{{ channel.name }}</span>
          </div>

          <span
            *ngIf="unreadMap[channel.publicId] > 0"
            class="badge bg-purple ms-2">
            {{ unreadMap[channel.publicId] }}
          </span>
        </a>
        </li>
      </ul>

    </div>

    <!-- MAIN CHAT CONTENT -->
    <div class="content flex-grow-1 bg-light" [ngClass]="{'dark-mode': isDarkMode$ | async, 'light-mode': !(isDarkMode$ | async)}">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>

<!-- CREATE CHANNEL MODAL -->
<div class="modal fade border-none" id="createChannelModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" role="document" >
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header d-flex justify-content-between" [style]="(isDarkMode$ | async) ? 'background-color: #1a1a22; color: #fff' : null">
        <h5 class="modal-title">Create Channel</h5>
        <span class="btn-cancel tm-close">✕</span>
      </div>

      <!-- Body -->
      <div class="modal-body" [ngClass]="{'dark-mode': isDarkMode$ | async, 'light-mode': !(isDarkMode$ | async)}" [style]="(isDarkMode$ | async) ? 'background-color: #1a1a22; color: #fff' : null">
        <form>

          <!-- Name -->
          <div class="mb-3">
            <label class="form-label">Channel Name</label>
            <input 
              type="text" 
              class="form-control"
              [(ngModel)]="newChannel.name"
              name="name"
              placeholder="Enter channel name">
          </div>

          <!-- Description -->
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea 
              class="form-control"
              [(ngModel)]="newChannel.description"
              name="description"
              placeholder="Enter channel description">
            </textarea>
          </div>

          <!-- Private -->
          <div class="form-check">
            <input 
              type="checkbox" 
              class="form-check-input"
              [(ngModel)]="newChannel.isPrivate"
              name="isPrivate">
            <label class="form-check-label">Private Channel</label>
          </div>

        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer" [style]="(isDarkMode$ | async) ? 'background-color: #1a1a22; color: #fff' : null">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button class="btn btn-primary" style="background-color: #a64bfb; border: none;" (click)="createChannel()">
          Create
        </button>
      </div>

    </div>
  </div>
</div>
