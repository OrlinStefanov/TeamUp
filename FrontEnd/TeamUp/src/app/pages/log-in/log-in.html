<div #pageDiv class="page" [ngClass]="{'light-mode': !isDarkMode, 'dark-mode': isDarkMode}">
  <div class="container">

    <!-- floating orbs -->
    <div class="orb orb-purple"></div>
    <div class="orb orb-cyan"></div>
    <div class="orb orb-pink"></div>

    <!-- grid background -->
    <div class="grid-bg"></div>
    <div class="mb-6 text-right">
      <button class="btn-toggle" (click)="toggleDarkMode()">
        @if (!isDarkMode) {
          <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-moon" viewBox="0 0 16 16" visible="true">
            <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278M4.858 1.311A7.27 7.27 0 0 0 1.025 7.71c0 4.02 3.279 7.276 7.319 7.276a7.32 7.32 0 0 0 5.205-2.162q-.506.063-1.029.063c-4.61 0-8.343-3.714-8.343-8.29 0-1.167.242-2.278.681-3.286"/>
          </svg>
        }
        @if (isDarkMode) {
          <svg id="sunImg" xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-brightness-high" viewBox="0 0 16 16" visible="false">
            <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
          </svg>
        }
      </button>
    </div>
    <h1 class="title">Sign in to your <span class="keyword">workspace</span></h1>
    <p class="subtitle">Jump back in and keep building.</p>
    <form #loginForm="ngForm" (ngSubmit)="login()">
      <!-- Email + Username -->
      <div class="flex gap-3">
        <div class="flex-1">
          <label class="form-label">Email/Username</label>
          <input type="email" class="form-control" placeholder="Enter email or username" name="emailOrUsername" [(ngModel)]="userData.emailOrUsername">
        </div>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="password-wrapper" style="position:relative; display:inline-block;">
          <input [type]="showPassword ? 'text' : 'password'" class="form-control" placeholder="Enter password" name="password" [(ngModel)]="userData.password">
          <button type="button" (click)="togglePassword()" class="btn-toggle-password">
            @if (!showPassword) {
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
              </svg>
            }
            @if (showPassword) {
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-slash" viewBox="0 0 16 16">
                <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/>
                <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/>
                <path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/>
              </svg>
            }
          </button>
        </div>
      </div>

      @if (errorMessage.length > 0) {
        <div class="flex items-center rounded relative" style="margin-top: -20px;" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" style="color: red;" class="bi bi-exclamation-circle-fill" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8 4a.905.905 0 0 0-.9.995l.35 3.507a.552.552 0 0 0 1.1 0l.35-3.507A.905.905 0 0 0 8 4m.002 6a1 1 0 1 0 0 2 1 1 0 0 0 0-2"/>
          </svg>
          <p style="margin-left: 10px; margin-top: 2px;" class="text-red-500 text-sm">{{ errorMessage }}</p>
        </div>
      }

      @if (userData.emailOrUsername.length > 0) {
        <div class="flex-1">
          <a (click)="openResetConfirm()" class="text-sm" style="color: #a64bfb;">Forgot Password?</a>
        </div>
      }

      <!-- Submit Button -->
      <div class="text-center">
        <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">Log In</button>
      </div>

      <!-- Login Link -->
      <div class="mt-6 text-center">
        <label>Don't have an account? <a href="/signup">Sign Up</a></label>
      </div>
    </form>
  </div>

  @if (showConfirmReset) {
    <div class="confirm-overlay">
      <div class="confirm-box">
        <form (ngSubmit)="sendResetEmail()">
          <h3>Reset <span style="color: #a64bfb; text-shadow: #a64bfb 0 0 10px;">Password</span></h3>
          <p>Are you sure you want to receive a password reset email<span style="color: #a64bfb;">?</span></p>
          <div class="confirm-actions">
            <button class="btn-primary" type="submit">Yes, send it</button>
            <button class="btn-cancel" (click)="closeResetConfirm()">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  }
</div>
