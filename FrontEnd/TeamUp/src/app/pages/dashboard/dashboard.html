    <div class="workspace-content">
        <div class="workspace-header">
            <h2>Welcome to your dashboard, {{userProfile.userName}}!</h2>
            <p>Here you can manage your workspaces, view recent activity, and stay updated with your team's progress.</p>
        </div>
        <div *ngFor="let workspace of workspaces">
            <div class="workspace-card">
                <h3>{{ workspace.title }}</h3>
                <p>{{ workspace.description }}</p>
                <a href="/workspace/{{workspace.publicId}}/tasks" class="btn-primary">Go to workspace</a>
            </div>
        </div>
    </div>
</div>
    <div *ngIf="showCreateWorkspace" class="confirm-overlay">
            <form #createWorkspaceForm="ngForm" (ngSubmit)="createWorkspace()">
                <div class="header-row">
                    <div>
                        <h4>
                            Create <span style="color: #a64bfb; text-shadow: #a64bfb 0 0 10px">workspace</span>
                        </h4>
                        <p>Set up a new workspace and invite your team<span class="highlight">.</span></p>
                    </div>
                    <button class="btn-cancel" (click)="closeCreateWorkspace()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-lg" viewBox="0 0 16 16">
                            <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
                        </svg>
                    </button>
                </div>
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="form-label">Workspace name</label>
                        <input type="text" class="form-control" placeholder="Enter workspace name" name="workspaceName" required>
                    </div>
                </div>
                <div class="flex gap-3" style="margin-top: 3%;">
                    <div class="flex-1">
                        <label class="form-label">Workspace description</label>
                        <textarea type="text" class="form-control" placeholder="Enter workspace description" name="workspaceDesc" style="min-height: 75px;"></textarea>
                    </div>
                </div>
                <div class="flex gap-3"style="margin-top: 3%;">
                    <div class="flex-1">
                        <label class="form-label">Invite people</label>
                        <input type="text" class="form-control" placeholder="Enter email or username" name="invitePeople">
                        </div>
                </div>
                <div class="confirm-actions">
                    <button class="btn-primary" type="submit" [disabled]="createWorkspaceForm.invalid">Create workspace</button>
                </div>
            </form>
        </div>
