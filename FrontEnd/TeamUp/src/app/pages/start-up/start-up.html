<div #pageDiv class="page" [ngClass]="{'light-mode': !(isDarkMode$ | async), 'dark-mode': isDarkMode$ | async}">
  <main class="startup-stage" aria-busy="true">
    <div class="brand-mark" aria-hidden="true">
      <span class="brand-ring brand-ring-one"></span>
      <span class="brand-ring brand-ring-two"></span>
      <img src="teamUpLogo.png" width="132" height="132" alt="" />
    </div>

    <section class="startup-copy">
      <h1>Team Up</h1>
      <p>Your perfect co-pilot for teamwork</p>
    </section>

    <div class="loading-track" role="status" aria-label="Loading Team Up">
      <span class="loading-fill"></span>
    </div>

    <div class="loading-steps" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </main>
</div>
