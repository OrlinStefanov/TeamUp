<div #pageDiv class="page" [ngClass]="{'light-mode': !(isDarkMode$ | async), 'dark-mode': isDarkMode$ | async}">
  <div class="text-center">
    <div class="mb-4">
        <img src="teamUpLogo.png" width="150" height="150" />
    </div>

    <h1 class="mb-3"><span style="color: #a64bfb; text-shadow: 0 0 3px #a64bfb;" >Team Up</span></h1>
    <p class="mb-4">Your perfect co-pilot for teamwork</p>
    <div class="d-flex justify-content-center gap-3 mt-5">
        <div class="spinner-grow" style="color: #a64bfb;" role="status">
        <span class="visually-hidden">...</span>
        </div>
        <div class="spinner-grow" style="color: #a64bfb;" role="status">
            <span class="visually-hidden">...</span>
        </div>
        <div class="spinner-grow" style="color: #a64bfb;" role="status">
            <span class="visually-hidden">...</span>
        </div>
    </div>

  </div>
</div>
